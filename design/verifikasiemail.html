    <style>
        body {
            background-color: #0F0F12;
            color: #e4e1e6;
        }

        .surface-card {
            background: linear-gradient(180deg, #1f1f22 0%, #131316 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .otp-input {
            background-color: #1b1b1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            border-color: #917eff;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #917eff 0%, #5d3fe0 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

<body class="min-h-screen flex flex-col font-body-md text-on-background text-body-md">
    <!-- TopAppBar suppressed due to transactional flow context -->
    <main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter mb-16">
        <div class="w-full max-w-md surface-card rounded-xl p-8 flex flex-col items-center">
            <!-- Brand Logo -->
            <div class="mb-8 flex flex-col items-center">
                <div class="flex items-center gap-2 mb-2">
                    <div
                        class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
                        <span class="material-symbols-outlined font-bold text-xl">token</span>
                    </div>
                    <span class="font-headline-lg text-primary text-xl font-black uppercase tracking-tighter">KING
                        VYPERS</span>
                </div>
                <p class="font-label-sm text-label-sm text-primary tracking-widest uppercase mt-1">
                    PREMIUM ROBLOX SCRIPT
                </p>
            </div>
            <!-- Verification Content -->
            <div class="text-center mb-8 w-full">
                <h2 class="text-2xl font-bold font-headline-lg text-on-surface mb-2">Verifikasi Email</h2>
                <p class="text-on-surface-variant text-sm mb-1">Kami telah mengirimkan kode verifikasi ke</p>
                <p class="text-primary font-medium">example@email.com</p>
            </div>
            <!-- OTP Form -->
            <form class="w-full flex flex-col items-center">
                <div class="flex gap-2 justify-center mb-6 w-full">
                    <input class="otp-input w-12 h-14 text-center text-xl font-bold text-on-surface rounded-lg"
                        maxlength="1" type="text" value="4" />
                    <input class="otp-input w-12 h-14 text-center text-xl font-bold text-on-surface rounded-lg"
                        maxlength="1" type="text" value="7" />
                    <input class="otp-input w-12 h-14 text-center text-xl font-bold text-on-surface rounded-lg"
                        maxlength="1" type="text" value="2" />
                    <input class="otp-input w-12 h-14 text-center text-xl font-bold text-on-surface rounded-lg"
                        maxlength="1" type="text" value="1" />
                    <input class="otp-input w-12 h-14 text-center text-xl font-bold text-on-surface rounded-lg"
                        maxlength="1" type="text" value="9" />
                    <input class="otp-input w-12 h-14 text-center text-xl font-bold text-on-surface rounded-lg"
                        maxlength="1" type="text" value="3" />
                </div>
                <div class="text-center mb-6 w-full">
                    <p class="text-on-surface-variant text-sm">Kode akan kadaluarsa dalam <span
                            class="text-primary font-mono font-bold">10:00</span></p>
                </div>
                <button class="btn-primary w-full py-3 rounded-lg font-bold text-white mb-6" type="button">
                    Verifikasi
                </button>
                <p class="text-on-surface-variant text-sm">
                    Belum menerima code? <a
                        class="text-primary hover:text-primary-container transition-colors font-medium" href="#">Kirim
                        ulang</a>
                </p>
            </form>
            <!-- Info Box -->
            <div
                class="mt-8 w-full bg-surface-container-low border border-outline-variant/30 rounded-lg p-4 flex items-start gap-3">
                <span class="material-symbols-outlined text-primary mt-0.5">
                    forward_to_inbox
                </span>
                <p class="text-sm text-on-surface-variant leading-tight">
                    Periksa juga folder Spam atau Promosi<br />
                    Jika tidak ada di kotak masuk utama.
                </p>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <script>
        // Simple auto-focus logic for OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
