<!DOCTYPE html>
<html class="dark" lang="en" style="">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>King Vypers - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Sora:wght@400;600;700;800&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#4c3399",
                        "outline": "#928ea1",
                        "on-primary": "#2e009c",
                        "surface-container-highest": "#353438",
                        "on-secondary-fixed-variant": "#4c3399",
                        "outline-variant": "#484555",
                        "on-tertiary-container": "#28283c",
                        "on-primary-fixed": "#1a0063",
                        "on-background": "#e4e1e6",
                        "primary-container": "#917eff",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#c9c4d8",
                        "error": "#ffb4ab",
                        "surface": "#131316",
                        "surface-variant": "#353438",
                        "on-tertiary": "#2f2e43",
                        "surface-tint": "#c9bfff",
                        "on-primary-container": "#28008a",
                        "tertiary": "#c6c4df",
                        "error-container": "#93000a",
                        "inverse-on-surface": "#303033",
                        "on-tertiary-fixed-variant": "#45455b",
                        "on-tertiary-fixed": "#1a1a2e",
                        "secondary-fixed-dim": "#cdbdff",
                        "on-primary-fixed-variant": "#441cc8",
                        "background": "#131316",
                        "secondary": "#cdbdff",
                        "inverse-primary": "#5d3fe0",
                        "surface-container": "#1f1f22",
                        "tertiary-container": "#908ea8",
                        "surface-container-high": "#2a2a2d",
                        "surface-container-low": "#1b1b1e",
                        "surface-bright": "#39393c",
                        "tertiary-fixed": "#e2e0fc",
                        "primary-fixed-dim": "#c9bfff",
                        "on-surface": "#e4e1e6",
                        "on-secondary": "#351782",
                        "on-error": "#690005",
                        "inverse-surface": "#e4e1e6",
                        "secondary-fixed": "#e7deff",
                        "on-secondary-fixed": "#1f005f",
                        "tertiary-fixed-dim": "#c6c4df",
                        "primary-fixed": "#e5deff",
                        "surface-container-lowest": "#0e0e11",
                        "surface-dim": "#131316",
                        "primary": "#c9bfff",
                        "on-secondary-container": "#bca9ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-desktop": "80px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "base": "8px",
                        "container-max": "1280px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Sora"],
                        "headline-lg": ["Sora"],
                        "body-md": ["Inter"],
                        "display-lg": ["Sora"],
                        "label-sm": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F0F12;
            color: #e4e1e6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #917eff 0%, #5d3fe0 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .input-field {
            background-color: #1f1f22;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus-within {
            border-color: #917eff;
        }

        .surface-card {
            background: linear-gradient(180deg, #1f1f22 0%, #131316 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .surface-card:hover {
            border-color: #917eff;
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <!-- Top Navigation (Suppressed per logic, as this is a linear/transactional login page) -->
    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter">
        <div class="w-full max-w-[480px] surface-card rounded-xl p-8 md:p-10 relative overflow-hidden backdrop-blur-xl">
            <!-- Branding -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-2 mb-2">
                    <div
                        class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
                        <span class="material-symbols-outlined font-bold text-xl">token</span>
                    </div>
                    <h1 class="font-headline-lg text-primary text-xl font-black uppercase tracking-tighter">KING VYPERS
                    </h1>
                </div>
                <p class="font-label-sm text-outline uppercase tracking-widest">Premium Roblox Script</p>
            </div>
            <!-- Header -->
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-on-surface mb-2">Selamat Datang Kembali</h2>
                <p class="text-on-surface-variant font-body-md text-sm">Masuk untuk melanjutkan ke dashboard.</p>
            </div>
            <!-- Login Form -->
            <form action="#" class="space-y-5">
                <!-- Email Input -->
                <div
                    class="bg-surface-container-low border border-surface-bright rounded-lg flex items-center px-4 py-3 group focus-within:border-primary transition-all">
                    <span
                        class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary mr-3 text-[20px]"
                        data-icon="mail">mail</span>
                    <input
                        class="w-full bg-transparent border-none p-0 text-on-surface placeholder:text-on-surface-variant focus:ring-0 focus:outline-none font-body-md text-sm"
                        placeholder="Email" required="" type="email">
                </div>
                <!-- Password Input -->
                <div
                    class="bg-surface-container-low border border-surface-bright rounded-lg flex items-center px-4 py-3 group relative focus-within:border-primary transition-all">
                    <span
                        class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary mr-3 text-[20px]"
                        data-icon="lock">lock</span>
                    <input
                        class="w-full bg-transparent border-none p-0 pr-10 text-on-surface placeholder:text-on-surface-variant focus:ring-0 focus:outline-none font-body-md text-sm"
                        placeholder="Password" required="" type="password">
                    <button
                        class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors focus:outline-none"
                        type="button">
                        <span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
                    </button>
                </div>
                <!-- Options Row -->
                <div class="flex items-center justify-between mt-4">
                    <label class="flex items-center cursor-pointer group">
                        <input
                            class="rounded border-outline-variant bg-surface-container text-primary focus:ring-primary focus:ring-offset-surface"
                            type="checkbox">
                        <span
                            class="ml-2 text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ingat
                            saya</span>
                    </label>
                    <a class="text-sm text-primary hover:text-primary-container transition-colors font-medium"
                        href="#">Lupa password?</a>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full btn-primary text-white font-bold py-3 px-4 rounded-lg mt-6 flex justify-center items-center gap-2"
                    type="submit">
                    Masuk
                </button>
            </form>
            <!-- Sign Up Link -->
            <div class="mt-8 text-center">
                <p class="text-sm text-on-surface-variant">
                    Belum punya akun? <a
                        class="text-primary font-medium hover:text-primary-container hover:underline transition-all"
                        href="#">Daftar di sini</a>
                </p>
            </div>
        </div>
    </main>
    <!-- Footer -->




</body>

</html>
